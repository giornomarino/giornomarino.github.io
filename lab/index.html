<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Splats · Giorno Marino</title>
<meta name="description" content="Giorno Marino 的实时 3D 像素高斯泼溅小实验：冰龙、雨中的乌贼。可以拖动旋转。">
<link rel="canonical" href="https://giornomarino.github.io/lab/">
<link rel="icon" type="image/png" href="../assets/pixel-pet.png">
<meta property="og:title" content="Pixel Splats · Giorno Marino">
<meta property="og:description" content="Real-time pixel-art gaussian splat scenes you can spin around.">
<meta property="og:url" content="https://giornomarino.github.io/lab/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#04060c;color:#c8d4e8;overflow:hidden}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.pixel{font-family:"Silkscreen",ui-monospace,monospace;letter-spacing:.02em}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.bar{position:fixed;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.bar > *{pointer-events:auto}
a{color:inherit;text-decoration:none}
.chip{background:rgba(10,14,24,.72);border:1px solid rgba(160,180,220,.18);border-radius:10px;padding:6px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scenes{display:flex;gap:6px}
.scenes button{font:inherit;color:inherit;cursor:pointer}
.scenes button[aria-pressed="true"]{background:#c8def5;color:#0a1020;border-color:transparent}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;opacity:.6;white-space:nowrap}
[data-lang="en"] .zh,[data-lang="zh"] .en{display:none}
.err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:20px}
</style>
</head>
<body>
<canvas id="c" aria-label="3D pixel splat scene"></canvas>
<div class="bar">
  <a class="chip pixel" href="../">← giornomarino</a>
  <div class="scenes" id="scenes"></div>
</div>
<div class="hint chip"><span class="zh">拖动旋转 · 滚轮 / 双指缩放</span><span class="en">Drag to orbit · scroll or pinch to zoom</span></div>
<div class="err" id="err"><p><span class="zh">你的浏览器不支持 WebGL 2，看不了这个效果。</span><span class="en">This needs WebGL 2, which your browser doesn't support.</span></p></div>
<script>
(function(){
  var l=null;try{l=localStorage.getItem('lang')}catch(e){}
  l=l||((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en');
  document.documentElement.setAttribute('data-lang',l);document.documentElement.lang=l==='zh'?'zh-CN':'en';
})();
</script>
<script type="module">
import { mount } from '../assets/splats/splat.js';
import { SCENES } from '../assets/splats/scenes.js';

let canvas = document.getElementById('c');
const box = document.getElementById('scenes');
const lang = document.documentElement.getAttribute('data-lang');
let current = null, view = null;

function show(name){
  if (!SCENES[name]) name = 'dragon';
  if (name === current) return;
  current = name;
  if (view) view.dispose();
  // fresh canvas per scene so each gets a clean WebGL context
  const fresh = canvas.cloneNode(false);
  canvas.replaceWith(fresh); canvas = fresh;
  try {
    view = mount(canvas, name, { zoom: true, pixelHeight: 240 });
  } catch (e) {
    console.error(e);
    document.getElementById('err').style.display = 'grid';
    return;
  }
  for (const b of box.children) b.setAttribute('aria-pressed', b.dataset.s === name ? 'true' : 'false');
  history.replaceState(null, '', '#' + name);
}

for (const [k, def] of Object.entries(SCENES)){
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.dataset.s = k;
  b.textContent = def.title[lang] || def.title.en;
  b.onclick = () => show(k);
  box.appendChild(b);
}
show(location.hash.slice(1) || new URLSearchParams(location.search).get('s') || 'dragon');
</script>
</body>
</html>
