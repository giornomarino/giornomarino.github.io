<script src="runtime.js"></script>
<script>
// Luminous Slime Shrine — built with @shapeshift-labs/ink-studio
function sceneSlimeShrine(seed) {
  const K = KIT,
    V = K.V,
    B = makeBuilder(seed, [
      0x06090e, // 0 abyss
      0x131922, // 1 dark slate
      0x242e3b, // 2 slate
      0x3d4b59, // 3 stone mid
      0x637380, // 4 stone light
      0x96a6ad, // 5 stone highlight
      0x143824, // 6 deep moss
      0x266236, // 7 moss mid
      0x4ca04c, // 8 moss bright
      0x0a342c, // 9 slime deep teal
      0x14664e, // 10 slime emerald
      0x28aa76, // 11 slime jade
      0x6ee898, // 12 slime bright mint
      0xd2ff9e, // 13 slime inner glow
      0xf4ffe4, // 14 slime specular core
      0x2c4e5c, // 15 glass dark
      0x64a8b8, // 16 glass mid
      0xcff2f6, // 17 glass rim
      0xc84818, // 18 lantern orange
      0xff982c, // 19 lantern amber
      0xffe066, // 20 lantern gold
      0xfff8d2, // 21 lantern core
      0x16242c, // 22 mist dark
      0x263c46, // 23 mist light
      0xffffff  // 24 pure white
    ]);

  const S = K.sculpt(makeSculpt(B)),
    rig = K.rig(B, S),
    cap = K.light.capture(B, S);

  S.sun = B.norm([-0.42, 0.76, -0.48]);
  S.view = B.norm([0.22, 0.24, 0.94]);
  S.res = 0.095;
  S.amb = 0.17;
  S.sky = 0.27;

  // Dynamic baked lighting cues from slime core + two stone lanterns
  S.lights.push(
    { p: [0, 1.55, 0.1], r: 4.2, s: 0.65 },
    { p: [-2.8, 1.8, 1.85], r: 3.4, s: 0.55 },
    { p: [2.8, 1.8, 1.85], r: 3.4, s: 0.55 }
  );

  const ST = {
    r: [1, 2, 3, 3, 4, 5],
    mod: (x, y, z) => 0.22 * (B.n3(x * 0.75, y * 0.75, z * 0.75) - 0.5),
    tex: (x, y, z, ny, t) =>
      ny > 0.52 && B.n3(x * 0.85 + 4, y * 0.85, z * 0.85) > 0.62 ? S.pick([6, 7, 8], t) : undefined
  };
  const H = { hold: true };

  // Mossy cobblestone dungeon floor
  S.ground(
    {
      r: [1, 1, 2, 2, 3],
      tex: (x, y, z, ny, t) => {
        const d = Math.hypot(x, z);
        if (d > 3.2 && B.n3(x * 0.45, z * 0.45, 3) > 0.54) return S.pick([6, 7, 8], t);
        return undefined;
      }
    },
    { rad: 9.2, zs: 0.85, res: 0.14 }
  );

  // Two-tier chamfered circular shrine dais + front stone stairs
  S.join('chamfer', S.lathe([0, 0, 0], 0.68, [2.85, 2.65], ST, H), S.lathe([0, -0.45, 0], 0.45, 4.4, ST, H), {
    r: 0.35,
    res: 0.085
  });
  K.build.stairs(S, [0, 0, 3.65], [0, -1], 0.68, { width: 2.1, mats: { stone: ST }, res: 0.08 });

  // Ancient fluted shrine arch & twin flanking pillars behind the slime
  const MATS = { stone: ST };
  K.build.arch(S, [0, 0, -2.55], { span: 3.8, height: 5.5, depth: 0.85, thick: 0.55, mats: MATS, res: 0.085 });
  for (const sx of [-1, 1]) {
    K.build.pillar(S, [sx * 3.45, 0, -1.65], 4.2, { r: 0.42, flutes: 7, mats: MATS, res: 0.085 });
    // Broken capstone & moss
    S.rock([sx * 3.45, 4.35, -1.65], [0.52, 0.25, 0.52], { r: [6, 7, 8] }, { res: 0.1 });
  }

  // Two carved stone lanterns flanking the front of the dais
  for (const sx of [-1, 1]) {
    const lx = sx * 2.8,
      lz = 1.85;
    S.lathe([lx, 0, lz], 1.15, [0.34, 0.2, 0.28], ST, { res: 0.075 });
    S.box([lx, 1.55, lz], [0.24, 0.26, 0.24], { r: [18, 19, 20, 21], em: true }, { res: 0.055 });
    // Lantern roof
    S.lathe([lx, 1.82, lz], 0.48, [0.54, 0.06], ST, { res: 0.07 });
    S.ball([lx, 2.34, lz], 0.1, ST, { res: 0.055 });
  }

  // Scattered mossy dungeon boulders
  for (const [rx, rz, rr] of [
    [-4.3, 0.8, 0.72],
    [4.4, 0.5, 0.65],
    [-3.8, -2.9, 0.82],
    [4.1, -2.6, 0.7]
  ]) {
    S.rock([rx, rr * 0.42, rz], rr, ST, { res: 0.11 });
  }

  // Bake static dungeon architecture first so the jelly slime casts no static hole underneath
  S.bake();

  // --- Hero Translucent Emerald Slime (K.look.jelly + smooth SDF blend + K.jelly physics!) ---
  const JEL_MAT = K.look.jelly([9, 10, 10, 11, 12], {
    depth: 1.35,
    k: 0.88,
    glow: [11, 12, 12, 13, 13, 14],
    at: 0.22,
    core: { p: [0, 1.52, -0.05], r: 0.55, k: 0.72 },
    gloss: { c: 24, at: 0.985, c2: 14, at2: 0.968 }
  });
  const G = Object.assign(S.grp(0.55), { tag: 'slime', res: 0.062, bump: [0.09, 1.45] });
  const body = S.ball([0, 1.58, 0.05], [1.48, 1.18, 1.38], JEL_MAT, G);
  S.ball([0, 2.38, -0.02], [0.85, 0.68, 0.82], JEL_MAT, G);
  S.ball([-1.05, 1.05, 0.62], [0.58, 0.42, 0.54], JEL_MAT, G);
  S.ball([1.08, 1.02, 0.45], [0.52, 0.38, 0.48], JEL_MAT, G);

  // Floating inner bubbles inside the translucent slime
  for (const [bx, by, bz, br] of [
    [-0.55, 1.75, 0.25, 0.18],
    [0.62, 1.48, 0.18, 0.15],
    [0.12, 2.25, -0.12, 0.13]
  ]) {
    S.ball([bx, by, bz], br, { r: [13, 14], em: true }, { ghost: true, res: 0.045, tag: 'slime' });
  }

  // Expressive eyes flush-mounted on the slime's organic skin via S.stud
  for (const sx of [-1, 1]) {
    const eye = S.stud(
      body,
      { at: [sx * 0.32, 0.22], sink: 0.18 },
      0.17,
      { r: [0], em: true },
      { ghost: true, res: 0.036, tag: 'slime' }
    );
    S.stud(
      eye,
      { at: [-0.32, 0.38], sink: 0.15 },
      0.055,
      { r: [24], em: true },
      { ghost: true, res: 0.03, tag: 'slime' }
    );
  }

  // Tiny baby mini-slime sitting on the stone steps
  const mini = S.ball(
    [1.62, 0.96, 1.42],
    [0.42, 0.34, 0.4],
    K.look.jelly([9, 10, 11, 12], {
      depth: 0.9,
      k: 0.8,
      glow: [11, 12, 13, 14],
      at: 0.25,
      core: { p: [1.62, 0.92, 1.42], r: 0.18, k: 0.65 },
      gloss: { c: 24, at: 0.98 }
    }),
    { res: 0.052, tag: 'slime' }
  );
  for (const sx of [-1, 1]) {
    S.stud(mini, { at: [sx * 0.32, 0.22], sink: 0.2 }, 0.05, { r: [0], em: true }, { ghost: true, res: 0.025, tag: 'slime' });
  }

  S.bake();

  // Emerald caustic glow projected onto the dais in front of the slime
  K.caustic(B, [0.35, 0.7, 1.25], 1.15, [14, 13, 12, 11], { a: 0.65, zs: 0.75, n: 32 });

  // Low creeping dungeon mist & volumetric god-rays
  K.mist(B, {
    rad: 8.6,
    zs: 0.82,
    y: 0.08,
    depth: 0.42,
    n: 110,
    cols: [22, 23],
    a: 0.11,
    size: [0.65, 1.25],
    drift: 0.32,
    where: (x, z) => Math.hypot(x, z) > 4.1
  });
  K.shafts(B, { from: [-2.8, 6.8, -3.2], dir: [0.42, -0.76, 0.48], len: 8.0, r: 0.55, n: 14, col: 14, a: 0.085 });
  K.shafts(B, { from: [1.2, 7.0, -3.4], dir: [0.42, -0.76, 0.48], len: 7.8, r: 0.38, n: 12, col: 21, a: 0.065 });

  // Specular glint stars on wet slime crown
  K.glint(B, [-0.55, 2.38, 0.98], [0.2, 1, 0], 0.24, 24);
  K.glint(B, [-0.88, 1.72, 0.92], [0.1, 1, 0], 0.13, 14);

  const pool = K.pool(B, 340),
    W = B.finish({
      cam: { target: [0, 1.85, 0.1], dist: 14.5, pitch: 0.23, yaw: 0.26, sway: 0.2 },
      detail: 12.5,
      palName: 'Luminous Slime Shrine',
      dither: 0.28,
      radius: 9.5,
      ao: { k: 0.52, range: 0.72 },
      fog: { c: 22, start: 0.65, max: 0.36 },
      refract: 6
    }),
    st = K.stage(W);

  rig.bind(st);

  // Real soft-body jelly physics pinned to the dais
  const slimeIds = Array.from(rig.list[rig.part('slime')]);
  const jel = K.jelly(st, slimeIds, {
    cell: 0.48,
    stiff: 0.12,
    damp: 2.2,
    squash: 0.75,
    vmax: 6.5
  });
  jel.pin(q => q[1] < 0.92);

  // Curling luminous firefly & spore particles
  const flow = K.flow.around(K.flow.sum(K.flow.curl(0.45, 0.9), K.flow.wind([0.1, 0.35, 0.05])), S.sdf, 0.5);
  const ps = K.particles(st, pool, { flow, ground: () => 0.05 });

  // Dynamic flickering lantern + pulsing slime core point lights
  const slimeLamp = { p: [0, 1.65, 0.15], r: 4.5, s: 0.38 },
    lLamp = { p: [-2.8, 1.65, 1.85], r: 3.6, s: 0.42 },
    rLamp = { p: [2.8, 1.65, 1.85], r: 3.6, s: 0.42 };
  const lit = K.light.system(st, cap, [slimeLamp, lLamp, rLamp]);

  let nextPoke = 1.4,
    nextSpore = 0;

  st.add(lit);
  st.add(jel);
  st.add(ps);
  st.add({
    update(dt, t) {
      // Gentle periodic playful jelly wobble
      if (t > nextPoke) {
        nextPoke = t + 2.3 + KIT.rnd() * 1.1;
        const a = KIT.rnd() * Math.PI * 2;
        jel.poke([Math.cos(a) * 1.1, 1.85, Math.sin(a) * 1.1], [-Math.cos(a) * 0.7, 0.65, -Math.sin(a) * 0.7], 2.8, 2.2);
      }
      // Emit rising glowing spores & lantern embers
      if (t >= nextSpore) {
        nextSpore = t + 0.16;
        const a = KIT.rnd() * Math.PI * 2,
          r = 0.7 + KIT.rnd() * 2.2;
        ps.embers([Math.cos(a) * r, 0.9 + KIT.rnd() * 0.6, Math.sin(a) * r], 1, [14, 13, 12]);
        if (KIT.rnd() < 0.45) {
          const sx = KIT.rnd() < 0.5 ? -2.8 : 2.8;
          ps.embers([sx, 1.7, 1.85], 1, [21, 20, 19]);
        }
      }
      // Subtle flicker on lantern lights & slime breathing pulse
      slimeLamp.s = 0.34 + 0.09 * Math.sin(t * 2.4);
      lLamp.s = 0.38 + 0.08 * Math.sin(t * 14.0) * Math.cos(t * 5.7);
      rLamp.s = 0.38 + 0.08 * Math.cos(t * 12.5 + 1.2) * Math.sin(t * 6.3);
      lit.touch();
    },
    poke(hit, o, d) {
      if (!hit) return;
      jel.poke(hit.p, d ? V.mul(d, 1.1) : [0, -1, 0], 5.5, 2.4);
      ps.sparks(hit.p, 16, [24, 14, 13, 12], null, 4.2);
      lit.flash(0.28, 0.16);
    }
  });

  // Soft contact shadow under the jelly slime
  st.add(
    K.fx.tint(
      st,
      K.field({
        soft: 0.55,
        shapes: [{ shape: K.shape.sphere([0, 0.1, 0.05], 2.1), color: [0.46, 0.56, 0.54] }]
      }),
      'multiply',
      { where: i => !rig.bid[i] && st.base[i * 16 + 1] > 0.45 && st.base[i * 16 + 1] < 0.85 }
    )
  );

  return W;
}


// Obsidian Ember Island — built with @shapeshift-labs/ink-studio
function sceneEmberIsland(seed) {
  const K = KIT,
    V = K.V,
    M = K.M,
    B = makeBuilder(seed, [
      0x07060d, // 0 void
      0x141220, // 1 deep basalt
      0x242236, // 2 basalt dark
      0x3c3a52, // 3 basalt mid
      0x605e78, // 4 basalt light
      0x8e8ca6, // 5 basalt rim
      0x183a30, // 6 dark lichen
      0x2c6852, // 7 arcane moss
      0x5e1218, // 8 magma deep
      0xb4261c, // 9 magma red
      0xf25c1e, // 10 magma orange
      0xffaa2e, // 11 magma gold
      0xfff098, // 12 magma white-gold
      0x3a1448, // 13 crystal deep violet
      0x7e2474, // 14 crystal magenta
      0xd24ca4, // 15 crystal rose
      0xff9cd8, // 16 crystal pink glow
      0xffe6f8, // 17 crystal specular
      0x262430, // 18 smoke dark
      0x423e4e, // 19 smoke mid
      0x686274, // 20 smoke light
      0x928c9c, // 21 smoke pale
      0x181426, // 22 mist void
      0x2c2440, // 23 mist violet
      0xffffff  // 24 pure white
    ]);

  const S = K.sculpt(makeSculpt(B)),
    rig = K.rig(B, S),
    cap = K.light.capture(B, S);

  S.sun = B.norm([0.48, 0.72, -0.45]);
  S.view = B.norm([-0.28, 0.24, 0.93]);
  S.res = 0.095;
  S.amb = 0.16;
  S.sky = 0.25;

  // Baked core crystal light + magma fissure glow
  S.lights.push(
    { p: [0, 3.1, 0], r: 5.8, s: 0.78 },
    { p: [0, 0.35, 0], r: 3.8, s: 0.55 }
  );

  const BASALT = {
    r: [1, 2, 2, 3, 4, 5],
    mod: (x, y, z) => 0.28 * (B.n3(x * 0.7, y * 0.7, z * 0.7) - 0.5),
    tex: (x, y, z, ny, t) => {
      // Glowing molten lava fissures carved across top of island
      if (ny > 0.55 && y > -0.15 && y < 0.45) {
        const d = Math.hypot(x, z);
        const crack = Math.abs(Math.sin(x * 1.15 + z * 0.85 + B.n3(x * 0.8, 0, z * 0.8) * 1.6));
        if (d < 3.4 && crack < 0.095) return S.pick([10, 11, 12], Math.min(1, t + 0.5));
        if (d > 2.9 && B.n3(x * 0.6 + 2, z * 0.6, 5) > 0.64) return S.pick([6, 7], t);
      }
      return undefined;
    }
  };
  const H = { hold: true };

  // Craggy floating inverted-cone basalt island
  const islandProfile = t => {
    // t=0 at bottom tip (-3.8), t=1 at top plateau (0.2)
    if (t < 0.72) return 0.18 + Math.pow(t / 0.72, 0.78) * 4.05 + 0.24 * Math.sin(t * 17);
    return 4.23 - (t - 0.72) * 1.1;
  };
  S.lathe([0, -3.8, 0], 4.05, islandProfile, BASALT, { res: 0.105, bump: [0.22, 0.85] });

  // Secondary hanging stalactite rock clusters underneath the floating island
  for (const [rx, ry, rz, rad, h] of [
    [-1.85, -3.1, 1.15, 0.85, 2.3],
    [1.95, -2.9, -1.05, 0.78, 2.1],
    [0.5, -3.3, 1.95, 0.65, 1.9],
    [-1.1, -2.8, -1.85, 0.72, 2.0]
  ]) {
    S.lathe([rx, ry, rz], h, t => 0.08 + Math.pow(t, 0.85) * rad, { r: [1, 2, 3, 4] }, { res: 0.11, bump: [0.16, 1.1] });
  }

  // Chamfered central obsidian altar + rune channel
  S.join('chamfer', S.box([0, 0.55, 0], [1.28, 0.35, 1.28], BASALT, H), S.box([0, 0.12, 0], [1.95, 0.2, 1.95], BASALT, H), {
    r: 0.28,
    res: 0.08
  });
  // Glowing magma basin ring on the altar
  S.torus([0, 0.92, 0], 0.82, 0.11, { r: [9, 10, 11, 12], em: true }, { res: 0.065 });

  // Four twisted fluted obsidian rune pillars around the altar
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const px = Math.cos(a) * 2.85,
      pz = Math.sin(a) * 2.85;
    const ph = i % 2 === 0 ? 3.55 : 2.75;
    const col = S.lathe([px, 0.15, pz], ph, [0.46, 0.32], BASALT, H);
    const flutes = S.fold(S.lathe([px + 0.42, 0.4, pz], ph - 0.5, 0.1, BASALT, H), { polar: 5, c: [px, 0, pz] }, H);
    S.warp(S.join('cut', col, flutes, H), { twist: (i % 2 === 0 ? 1 : -1) * 0.65, c: [px, 0, pz], wide: 0.6 }, { res: 0.075 });
    // Glowing rune band wrapping each pillar
    S.torus([px, 0.2 + ph * 0.62, pz], 0.4, 0.065, { r: [10, 11, 12], em: true }, { res: 0.055 });
    // Floating broken pillar cap
    S.box([px, 0.25 + ph, pz], [0.44, 0.14, 0.44], BASALT, { res: 0.08, rotY: a });
  }

  // Scattered obsidian boulders & ember vents
  for (const [bx, bz, br] of [
    [-3.15, 0.3, 0.55],
    [3.1, -0.45, 0.52],
    [0.2, 3.1, 0.48],
    [-0.4, -3.25, 0.56]
  ]) {
    S.rock([bx, 0.25 + br * 0.35, bz], br, BASALT, { res: 0.1 });
  }

  S.bake();

  // --- Levitating Faceted Magma-Rune Crystal (Translucent K.look.jelly + Emissive Core) ---
  const CRY_C = [0, 2.95, 0];
  const CRYSTAL_MAT = K.look.jelly([13, 14, 15, 16], {
    depth: 1.4,
    k: 0.92,
    glow: [10, 11, 11, 12, 16, 17],
    at: 0.24,
    core: { p: CRY_C, r: 0.45, k: 0.95 },
    gloss: { c: 24, at: 0.985, c2: 17, at2: 0.965 }
  });
  // Double-ended faceted diamond crystal
  S.lathe([0, 2.95, 0], 1.55, t => Math.max(0.03, (1 - t) * 0.78), CRYSTAL_MAT, { res: 0.058, tag: 'crystal', whole: true });
  S.lathe([0, 1.85, 0], 1.12, t => Math.max(0.03, t * 0.78), CRYSTAL_MAT, { res: 0.058, tag: 'crystal', whole: true });
  // Molten glowing inner heart inside the crystal
  S.ball(CRY_C, [0.3, 0.52, 0.3], { r: [11, 12, 24], em: true }, { ghost: true, res: 0.05, tag: 'crystal' });

  // Six orbiting mini rune crystal shards
  const SHARDS = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const rad = 1.85 + (i % 2) * 0.35;
    const pos = [Math.cos(a) * rad, 2.65 + Math.sin(i * 1.8) * 0.55, Math.sin(a) * rad];
    SHARDS.push({ pos, a, rad, y0: pos[1] });
    const mat = i % 2 === 0 ? { r: [10, 11, 12], em: true } : { r: [14, 15, 16, 17], em: true };
    S.lathe([pos[0], pos[1] - 0.32, pos[2]], 0.64, t => 0.16 * Math.sin(t * Math.PI), mat, {
      res: 0.055,
      tag: 'shard' + i,
      whole: true
    });
  }

  S.bake();

  // Molten ember caustic glow on the obsidian altar
  K.caustic(B, [0, 0.94, 0], 1.35, [12, 11, 10, 9], { a: 0.7, zs: 0.9, n: 30 });

  // Volumetric ember shafts & dark abyss mist beneath the floating island
  K.shafts(B, { from: [2.4, 7.2, -2.4], dir: [-0.42, -0.78, 0.44], len: 8.5, r: 0.52, n: 13, col: 12, a: 0.08 });
  K.shafts(B, { from: [-1.8, 6.8, -2.6], dir: [0.35, -0.82, 0.42], len: 8.2, r: 0.4, n: 11, col: 16, a: 0.07 });
  K.mist(B, {
    rad: 7.5,
    zs: 0.9,
    y: -3.2,
    depth: 1.2,
    n: 100,
    cols: [22, 23],
    a: 0.14,
    size: [0.85, 1.6],
    drift: 0.4,
    where: () => true
  });

  // Glints on crystal facets
  K.glint(B, [0.32, 3.65, 0.55], [0.25, 1, 0], 0.28, 24);
  K.glint(B, [-0.42, 2.75, 0.52], [-0.15, 1, 0], 0.16, 17);

  const poolEmbers = K.pool(B, 340),
    poolSmoke = K.pool(B, 140),
    W = B.finish({
      cam: { target: [0, 0.7, 0], dist: 17.5, pitch: 0.22, yaw: 0.04, sway: 0.22 },
      detail: 12.5,
      palName: 'Obsidian Ember Island',
      dither: 0.28,
      radius: 9.8,
      ao: { k: 0.5, range: 0.72 },
      fog: { c: 22, start: 0.68, max: 0.38 },
      refract: 6
    }),
    st = K.stage(W);

  rig.bind(st);

  // Self-shadowing volcanic smoke rising from the molten altar ring
  const smoke = st.add(
    K.smoke(st, poolSmoke, {
      at: [0, 1.15, 0],
      ramp: [18, 18, 19, 20, 21],
      sun: S.sun,
      rate: 6.5,
      life: 3.6,
      size: [0.16, 0.68],
      a: 0.45,
      shadow: 1.25,
      rise: 2.2,
      flow: K.flow.sum(K.flow.wind([0.18, 0.25, -0.1]), K.flow.curl(0.55, 0.85))
    })
  );

  // Curling magma embers flowing AROUND the twisted pillars
  const flow = K.flow.around(K.flow.sum(K.flow.curl(0.45, 1.15), K.flow.wind([0.12, 0.85, 0.08])), S.sdf, 0.55);
  const ps = K.particles(st, poolEmbers, { flow, ground: () => -6 });

  // Dynamic pulsing crystal & altar lights
  const cryLamp = { p: [0, 3.0, 0], r: 6.2, s: 0.55 },
    magmaLamp = { p: [0, 0.95, 0], r: 4.2, s: 0.36 };
  const lit = K.light.system(st, cap, [cryLamp, magmaLamp]);

  let nextEmber = 0;

  st.add(lit);
  st.add(ps);
  st.add({
    update(dt, t) {
      // Levitate & spin the central rune crystal
      const bob = Math.sin(t * 1.9) * 0.26;
      const Rc = M.mul(M.rot([0, 1, 0], t * 0.72), M.rot([0, 0, 1], Math.sin(t * 0.9) * 0.1));
      rig.set('crystal', Rc, CRY_C, [CRY_C[0], CRY_C[1] + bob, CRY_C[2]]);

      // Orbit the 6 crystal shards around the core
      for (let i = 0; i < SHARDS.length; i++) {
        const sh = SHARDS[i];
        const ang = sh.a + t * (i % 2 === 0 ? 0.58 : -0.44);
        const np = [Math.cos(ang) * sh.rad, sh.y0 + Math.sin(t * 2.1 + i) * 0.28, Math.sin(ang) * sh.rad];
        rig.set('shard' + i, M.rot([0, 1, 0], t * 1.4 + i), sh.pos, np);
      }
      rig.apply();

      // Emit rising glowing embers from lava cracks & crystal
      if (t >= nextEmber) {
        nextEmber = t + 0.09;
        const a = KIT.rnd() * Math.PI * 2,
          r = 0.5 + KIT.rnd() * 2.4;
        ps.embers([Math.cos(a) * r, 0.38, Math.sin(a) * r], 2, [12, 11, 10, 9]);
        if (KIT.rnd() < 0.35) {
          ps.embers([0, 2.95 + bob, 0], 1, [17, 16, 12]);
        }
      }

      // Pulse dynamic lights
      cryLamp.p[1] = 2.95 + bob;
      cryLamp.s = 0.5 + 0.14 * Math.sin(t * 3.1);
      magmaLamp.s = 0.34 + 0.08 * Math.sin(t * 9.5) * Math.cos(t * 4.3);
      lit.touch();
    },
    poke(hit) {
      if (!hit) return;
      ps.sparks(hit.p, 22, [24, 12, 11, 10, 16], null, 5.2);
      smoke.burst([hit.p[0], hit.p[1] + 0.2, hit.p[2]], 8);
      lit.flash(0.42, 0.18);
    }
  });

  return W;
}


</script>
<script>
(() => {
  const canvas = document.getElementById('view');
  const descEl = document.getElementById('desc');
  const stSplats = document.getElementById('stSplats');
  const stFps = document.getElementById('stFps');

  const renderer = window.createInkRenderer(canvas, { toolkit: { KIT, PixelLook } });

  const META = {
    slime: {
      build: () => sceneSlimeShrine(11),
      desc: '幽光史莱姆祭坛：真实果冻软体物理（点击可戳动回弹）、内部发光核心、青翠焦散光斑、体积光束与苔藓石灯。'
    },
    island: {
      build: () => sceneEmberIsland(19),
      desc: '熔火符文浮岛：倒锥浮空玄武岩岛、扭曲浮雕符文石柱、半透发光晶核与环绕碎片、自阴影火山烟雾与绕柱火星。'
    }
  };

  const cache = {};
  let curKey = 'slime';
  let world = null;
  let camera = null;
  let autoOrbit = true;
  let paused = false;
  let elapsed = 0;

  function switchScene(key) {
    curKey = key;
    if (!cache[key]) cache[key] = META[key].build();
    world = cache[key];
    camera = { ...world.cam };
    world.detail = Number(document.getElementById('slDetail').value);
    world.dither = Number(document.getElementById('slDither').value);
    descEl.textContent = META[key].desc;
    stSplats.textContent = 'Splats: ' + world.count.toLocaleString();
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(320, Math.floor(window.innerWidth * dpr));
    canvas.height = Math.max(200, Math.floor(window.innerHeight * dpr));
  }
  window.addEventListener('resize', resize);
  resize();
  switchScene('slime');

  // Pointer orbit + click-to-poke interaction
  let drag = null, moved = false;
  canvas.addEventListener('pointerdown', (e) => {
    drag = [e.clientX, e.clientY, camera.yaw, camera.pitch];
    moved = false;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag[0], dy = e.clientY - drag[1];
    if (Math.hypot(dx, dy) > 4) moved = true;
    camera.yaw = drag[2] - dx * 0.0065;
    camera.pitch = Math.max(-0.25, Math.min(1.2, drag[3] + dy * 0.006));
  });
  canvas.addEventListener('pointerup', (e) => {
    if (drag && !moved && world && world.anim && world.anim.poke) {
      // Trigger interactive poke near center of target with slight screen offset
      const rect = canvas.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const ny = 1 - ((e.clientY - rect.top) / rect.height) * 2;
      const p = [
        camera.target[0] + nx * 1.4,
        camera.target[1] + ny * 1.1,
        camera.target[2] + 0.6
      ];
      world.anim.poke({ p, part: 0 }, p, [0, -0.5, -1]);
    }
    drag = null;
  });
  canvas.addEventListener('pointercancel', () => { drag = null; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camera.dist = Math.max(6.5, Math.min(30, camera.dist * Math.exp(e.deltaY * 0.001)));
  }, { passive: false });

  // UI bindings
  document.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      switchScene(btn.dataset.scene);
    });
  });
  document.getElementById('slDetail').addEventListener('input', (e) => {
    const v = Number(e.target.value);
    document.getElementById('vDetail').textContent = v.toFixed(1);
    if (world) world.detail = v;
  });
  document.getElementById('slDither').addEventListener('input', (e) => {
    const v = Number(e.target.value);
    document.getElementById('vDither').textContent = v.toFixed(2);
    if (world) world.dither = v;
  });
  const btnAuto = document.getElementById('btnAuto');
  btnAuto.addEventListener('click', () => {
    autoOrbit = !autoOrbit;
    btnAuto.classList.toggle('on', autoOrbit);
  });
  const btnPlay = document.getElementById('btnPlay');
  btnPlay.addEventListener('click', () => {
    paused = !paused;
    btnPlay.classList.toggle('on', !paused);
    btnPlay.textContent = paused ? '已暂停' : '播放中';
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    if (world) camera = { ...world.cam };
  });
  const toggleBtn = document.getElementById('togglePanel');
  const ctrlBody = document.getElementById('ctrlBody');
  toggleBtn.addEventListener('click', () => {
    const c = ctrlBody.classList.toggle('collapsed');
    toggleBtn.textContent = c ? '展开' : '收起';
  });

  let last, frames = 0, fpsAt = performance.now();
  function frame(now) {
    const dt = last === undefined ? 0 : Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      elapsed += dt;
      if (world && world.anim) world.anim.update(dt, elapsed);
      if (autoOrbit && !drag) camera.yaw += dt * 0.22;
    }
    if (world) {
      renderer.render(world, {
        width: canvas.width,
        height: canvas.height,
        time: elapsed,
        camera,
        damp: false
      });
    }
    frames++;
    if (now - fpsAt >= 500) {
      stFps.textContent = 'FPS: ' + Math.round((frames * 1000) / (now - fpsAt));
      frames = 0; fpsAt = now;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
// Open a scene from the URL hash (#slime / #island) and keep the hash in sync.
(function(){
  function pick(){
    var s = location.hash.slice(1);
    var b = s && document.querySelector('.tab[data-scene="' + s + '"]');
    if (b && !b.classList.contains('active')) b.click();
  }
  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click', function(){ history.replaceState(null, '', '#' + b.dataset.scene); });
  });
  pick();
  window.addEventListener('hashchange', pick);
})();
</script>
</body>
